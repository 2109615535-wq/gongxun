gdb port disabled
tcl port disabled
telnet port disabled

source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f4x.cfg]

adapter serial LU_2022_8888
cmsis-dap backend hid
cmsis-dap quirk enable
adapter speed 100

# Keep reset at 100 kHz and switch to 10 MHz after reset init for programming.
stm32f4x.cpu configure -event reset-start {adapter speed 100}
stm32f4x.cpu configure -event reset-init {adapter speed 10000}

proc program_gongxun1 {image} {
    if {[catch {
        init
        reset halt
        for {set attempt 0} {$attempt < 3} {incr attempt} {
            set id [lindex [read_memory 0xe0042000 32 1] 0]
            set flash_kib [lindex [read_memory 0x1fff7a22 16 1] 0]
            if {($id & 0xfff) != 0x413 || $flash_kib != 512} {
                error "Unexpected MCU identity or flash size ($id, $flash_kib KiB)"
            }
            read_memory 0x08000000 32 16
        }
    } reason]} {
        echo "SWD check failed before programming"
        echo $reason
        shutdown error
    }
    echo "Three target and flash reads passed"
    program $image verify reset exit
}
